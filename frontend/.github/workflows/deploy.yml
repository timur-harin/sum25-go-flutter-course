# frontend/.github/workflows/deploy.yml
name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production  # Optional environment setting

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable   # Stable Flutter channel
          cache: true      # Enable dependency caching

      # Step 3: Install dependencies
      - name: Get packages
        run: flutter pub get
        working-directory: frontend

      # Step 4: Build web application
      - name: Build project
        run: |
          flutter config --enable-web
          flutter build web --release --base-href "/${{ github.event.sum25-go-flutter-course }}/"
        working-directory: frontend
      
      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build/web
          keep_files: false  # Clean target directory before deployment
