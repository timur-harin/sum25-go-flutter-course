name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - lab07-nagimova-adeliya

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.4

      - name: Install dependencies
        run: flutter pub get
        working-directory: labs/lab07/frontend

      - name: Build web
        run: |
          flutter create . --platforms web
          flutter build web --base-href /sum25-go-flutter-course/
        working-directory: labs/lab07/frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: labs/lab07/frontend/build/web

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: labs/lab07/backend
          push: true
          tags: nalemian/go-flutter-lab07:latest
