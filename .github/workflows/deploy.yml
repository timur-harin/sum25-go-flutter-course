name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - lab07-zaynulin-salavat
      - lab06-zaynulin-salavat
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.1'

      - name: Show frontend directory contents (debug)
        run: |
          ls -la labs/lab07/frontend
          ls -la labs/lab07/frontend/lib
          cat labs/lab07/frontend/pubspec.yaml

      - name: Flutter doctor & version (debug)
        run: |
          flutter --version
          flutter doctor -v
          cat labs/lab07/frontend/pubspec.lock || echo "No pubspec.lock"

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Show Flutter devices (debug)
        run: flutter devices

      - name: Create web directory if missing
        run: |
          cd labs/lab07/frontend
          flutter create --platforms web .
        
      - name: Install dependencies
        run: flutter pub get
        working-directory: labs/lab07/frontend

      - name: Build web
        run: flutter build web --release
        working-directory: labs/lab07/frontend
        
      - name: Check build output (debug)
        run: |
          ls -la labs/lab07/frontend/build/web || echo "No build/web directory"
          ls -la labs/lab07/frontend/build/web/index.html || echo "No index.html"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: labs/lab07/frontend/build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy Flutter app to GitHub Pages'