name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ lab07-permiakov-lev ]  # Trigger on pushes to lab07-permiakov-lev branch
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'  # or 'beta', 'dev' depending on your needs

      - name: Install dependencies
        run: flutter pub get
        working-directory: labs/lab07/frontend

      - name: Build web
        run: flutter create . --platforms web
          flutter build web --base-href /sum25-go-flutter-course/
        working-directory: labs/lab07/frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: labs/lab07/frontend/build/web
          keep_files: false  # Set to true if you want to keep previous files