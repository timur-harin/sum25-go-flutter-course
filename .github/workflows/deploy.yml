name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - lab07-khusnutdinov-kamil
  workflow_dispatch:  # Возможность ручного запуска

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.1' # Укажи свою версию Flutter, если нужно

      - name: Install dependencies
        run: flutter pub get
        working-directory: labs/lab07/frontend

      - name: Build web
        run: flutter build web --base-href="/sum25-go-flutter-course/"
        working-directory: labs/lab07/frontend


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages                # <-- вот это добавь
          publish_dir: labs/lab07/frontend/build/web
